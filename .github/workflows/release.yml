name: Release

# Publishes a stable release whenever extension code is merged to main.
# Version comes from source.extension.vsixmanifest's Identity/@Version (MAJOR.MINOR.PATCH,
# bumped by hand). This workflow fails if that version wasn't increased since the last release.
on:
  push:
    branches: [main]
    paths:
      - "Tabkeeper.Core/**"
      - "Tabkeeper.Vsix/**"
      - "Tabkeeper.slnx"
      - "global.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read and verify version
        id: version
        shell: pwsh
        run: |
          $manifest = 'Tabkeeper.Vsix/source.extension.vsixmanifest'
          if ((Get-Content $manifest -Raw) -notmatch '<Identity\b[^>]*\bVersion="([^"]+)"') {
            throw "Could not find Identity/@Version in $manifest"
          }
          $version = $Matches[1]

          git fetch --tags --quiet
          $lastTag = git tag --list 'v*' |
            ForEach-Object { $_.TrimStart('v') } |
            Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_ } |
            Select-Object -Last 1

          if ($lastTag -and [version]$version -le [version]$lastTag) {
            throw "source.extension.vsixmanifest Identity/@Version ($version) must be greater than the last release ($lastTag). Bump the Version attribute before releasing."
          }

          "vsix=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release v$version"

      - name: Restore dependencies
        run: dotnet restore Tabkeeper.slnx

      - name: Build release VSIX
        run: dotnet build Tabkeeper.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.vsix }}

      - name: Run tests
        run: dotnet test Tabkeeper.slnx --configuration Release --no-build --no-restore

      - name: Compute checksum
        id: hash
        shell: pwsh
        run: |
          $vsix = Get-ChildItem Tabkeeper.Vsix/bin/Release -Recurse -Filter *.vsix | Select-Object -First 1
          $sha  = (Get-FileHash $vsix.FullName -Algorithm SHA256).Hash.ToLower()
          "$sha  $($vsix.Name)" | Set-Content "$($vsix.FullName).sha256" -NoNewline
          "sha256=$sha" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body: |
            ---
            `Tabkeeper.vsix` SHA-256: `${{ steps.hash.outputs.sha256 }}`
          fail_on_unmatched_files: true
          files: |
            Tabkeeper.Vsix/bin/Release/**/*.vsix
            Tabkeeper.Vsix/bin/Release/**/*.vsix.sha256

