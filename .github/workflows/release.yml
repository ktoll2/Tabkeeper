name: Release

# Publishes a stable release whenever extension code is merged to main.
# Version is derived (YYYY.M.D.<run>), never hand-maintained.
on:
  push:
    branches: [main]
    paths:
      - "Tabkeeper.Core/**"
      - "Tabkeeper.Vsix/**"
      - "Tabkeeper.slnx"
      - "global.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $v = "{0}.{1}" -f (Get-Date -Format 'yyyy.M.d'), ${{ github.run_number }}
          "vsix=$v"  >> $env:GITHUB_OUTPUT
          "tag=v$v"  >> $env:GITHUB_OUTPUT

      - name: Stamp VSIX version
        shell: pwsh
        run: |
          $manifest = 'Tabkeeper.Vsix/source.extension.vsixmanifest'
          (Get-Content $manifest -Raw) -replace '(<Identity\b[^>]*\bVersion=")[^"]*(")', "`${1}${{ steps.version.outputs.vsix }}`${2}" |
            Set-Content $manifest -NoNewline
          Write-Host "Release ${{ steps.version.outputs.tag }} (VSIX ${{ steps.version.outputs.vsix }})"

      - name: Restore dependencies
        run: dotnet restore Tabkeeper.slnx

      - name: Build release VSIX
        run: dotnet build Tabkeeper.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.vsix }}

      - name: Run tests
        run: dotnet test Tabkeeper.slnx --configuration Release --no-build --no-restore

      - name: Compute checksum
        id: hash
        shell: pwsh
        run: |
          $vsix = Get-ChildItem Tabkeeper.Vsix/bin/Release -Recurse -Filter *.vsix | Select-Object -First 1
          $sha  = (Get-FileHash $vsix.FullName -Algorithm SHA256).Hash.ToLower()
          "$sha  $($vsix.Name)" | Set-Content "$($vsix.FullName).sha256" -NoNewline
          "sha256=$sha" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body: |
            ---
            `Tabkeeper.vsix` SHA-256: `${{ steps.hash.outputs.sha256 }}`
          fail_on_unmatched_files: true
          files: |
            Tabkeeper.Vsix/bin/Release/**/*.vsix
            Tabkeeper.Vsix/bin/Release/**/*.vsix.sha256

