name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BranchPins.slnx

      - name: Build release VSIX
        run: dotnet build BranchPins.slnx --configuration Release --no-restore

      - name: Run core tests
        run: dotnet test tests/BranchPins.Core.Tests/BranchPins.Core.Tests.csproj --configuration Release --no-build --no-restore

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPins-VSIX
          path: src/BranchPins.Vsix/bin/Release/*.vsix
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src/BranchPins.Vsix/bin/Release/*.vsix
