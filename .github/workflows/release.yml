name: Release

# Manual only: this never runs on push or pull_request. Builds both platforms in one run, each
# through its own Makefile. Choose "release" or "prerelease" to also publish both .vsix packages
# to one shared GitHub release. Both platforms build at exactly whatever version the repo-root
# VERSION file holds (bumped by hand before triggering a release): visualstudio/scripts/version.ps1
# keeps source.extension.vsixmanifest's Identity/@Version in sync with it, and vscode/Makefile's
# `package` target passes it straight through to `vsce package <version>` (which updates
# vscode/package.json and package-lock.json itself via `npm version`). The release tag and the
# "version must increase" check work off that same value; a prerelease's tag gets a run-number
# suffix for uniqueness, but the packaged version itself is never modified.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release for this build?"
        type: choice
        options:
          - none
          - prerelease
          - release
        default: none

permissions:
  contents: write

jobs:
  visualstudio:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: visualstudio
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # windows-latest ships PowerShell but not GNU Make; Chocolatey (which windows-latest does
      # ship) installs it in a few seconds.
      - name: Install GNU Make
        run: choco install make --no-progress -y

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $baseVersion = make current-version

          if ('${{ inputs.release }}' -eq 'prerelease') {
            "tag=v$baseVersion-pre.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          } elseif ('${{ inputs.release }}' -eq 'release') {
            git fetch --tags --quiet
            $lastTag = git tag --list 'v*' |
              ForEach-Object { $_.TrimStart('v') } |
              Where-Object { $_ -match '^\d+(\.\d+){2,3}$' } |
              Sort-Object { [version]$_ } |
              Select-Object -Last 1

            if ($lastTag -and [version]$baseVersion -le [version]$lastTag) {
              throw "VERSION ($baseVersion) must be greater than the last release ($lastTag). Bump the VERSION file before releasing."
            }

            "tag=v$baseVersion" >> $env:GITHUB_OUTPUT
          } else {
            "tag=" >> $env:GITHUB_OUTPUT
          }

          Write-Host "Version $baseVersion"

      - name: Build and test
        run: make test

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tabkeeper-VSIX
          path: visualstudio/Tabkeeper.Vsix/bin/Release/**/*.vsix
          if-no-files-found: error

      - name: Compute checksum
        id: hash
        if: inputs.release != 'none'
        shell: pwsh
        run: |
          $vsix = Get-ChildItem Tabkeeper.Vsix/bin/Release -Recurse -Filter *.vsix | Select-Object -First 1
          $sha  = (Get-FileHash $vsix.FullName -Algorithm SHA256).Hash.ToLower()
          "$sha  $($vsix.Name)" | Set-Content "$($vsix.FullName).sha256" -NoNewline
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "vsix=$($vsix.Name)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        if: inputs.release != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ inputs.release == 'prerelease' }}
          generate_release_notes: true
          append_body: true
          body: |
            ---
            `${{ steps.hash.outputs.vsix }}` SHA-256: `${{ steps.hash.outputs.sha256 }}`
          fail_on_unmatched_files: true
          files: |
            visualstudio/Tabkeeper.Vsix/bin/Release/**/*.vsix
            visualstudio/Tabkeeper.Vsix/bin/Release/**/*.vsix.sha256

      #- name: Publish to VS Marketplace
      #  if: ${{ secrets.VS_MARKETPLACE_PAT != '' }}
      #  shell: pwsh
      #  env:
      #    VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
      #  run: |
      #    $publisher = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.vssdk.buildtools" -Recurse -Filter VsixPublisher.exe | Select-Object -First 1
      #    $vsix = Get-ChildItem Tabkeeper.Vsix/bin/Release -Recurse -Filter *.vsix | Select-Object -First 1
      #    & $publisher.FullName publish -payload $vsix.FullName -publishManifest Tabkeeper.Vsix/publish.json -personalAccessToken $env:VS_MARKETPLACE_PAT

  vscode:
    needs: visualstudio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: make ci

      # xvfb-run gives the VS Code test host a virtual display; ubuntu-latest runners have no X
      # server, and @vscode/test-electron launches a real (if invisible) Electron window.
      - name: Build and test
        run: xvfb-run -a make test

      - name: Package
        run: make package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tabkeeper-VSIX-vscode
          path: vscode/*.vsix
          if-no-files-found: error

      - name: Compute checksum
        id: hash
        if: inputs.release != 'none'
        run: |
          vsix="$(ls *.vsix | head -n1)"
          sha="$(sha256sum "$vsix" | awk '{print $1}')"
          echo "$sha  $vsix" > "$vsix.sha256"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: inputs.release != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.visualstudio.outputs.tag }}
          name: ${{ needs.visualstudio.outputs.tag }}
          prerelease: ${{ inputs.release == 'prerelease' }}
          generate_release_notes: true
          append_body: true
          body: |
            ---
            `${{ steps.hash.outputs.vsix }}` SHA-256: `${{ steps.hash.outputs.sha256 }}`
          fail_on_unmatched_files: true
          files: |
            vscode/*.vsix
            vscode/*.vsix.sha256
