name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Tabkeeper.slnx

      - name: Build VSIX and libraries
        run: dotnet build Tabkeeper.slnx --configuration Release --no-restore

      - name: Run core tests
        run: dotnet test Tabkeeper.Core.Tests/Tabkeeper.Core.Tests.csproj --configuration Release --no-build --no-restore

      - name: Upload VSIX package
        uses: actions/upload-artifact@v4
        with:
          name: Tabkeeper-VSIX
          path: Tabkeeper.Vsix/bin/Release/**/*.vsix
          if-no-files-found: error
