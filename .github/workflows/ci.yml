name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BranchPins.slnx

      - name: Build VSIX and libraries
        run: dotnet build BranchPins.slnx --configuration Release --no-restore

      - name: Run core tests
        run: dotnet test tests/BranchPins.Core.Tests/BranchPins.Core.Tests.csproj --configuration Release --no-build --no-restore

      - name: Upload VSIX package
        uses: actions/upload-artifact@v4
        with:
          name: BranchPins-VSIX
          path: src/BranchPins.Vsix/bin/Release/*.vsix
          if-no-files-found: error
