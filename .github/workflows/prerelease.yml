name: Prerelease

# Every push to the 'prerelease' branch publishes a GitHub pre-release.
# Base version comes from source.extension.vsixmanifest's Identity/@Version (bumped by
# hand); this workflow appends the run number as a 4th segment so repeated pushes
# without a manual bump still get a unique, increasing VSIX version.
on:
  push:
    branches: [prerelease]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Stamp prerelease version
        id: version
        shell: pwsh
        run: |
          $manifest = 'Tabkeeper.Vsix/source.extension.vsixmanifest'
          $content = Get-Content $manifest -Raw
          if ($content -notmatch '<Identity\b[^>]*\bVersion="([^"]+)"') {
            throw "Could not find Identity/@Version in $manifest"
          }
          $baseVersion = $Matches[1]
          $vsixVersion = "$baseVersion.${{ github.run_number }}"
          $content -replace '(<Identity\b[^>]*\bVersion=")[^"]*(")', "`${1}$vsixVersion`${2}" |
            Set-Content $manifest -NoNewline

          "vsix=$vsixVersion"                              >> $env:GITHUB_OUTPUT
          "tag=v$baseVersion-pre.${{ github.run_number }}"  >> $env:GITHUB_OUTPUT
          Write-Host "Prerelease v$baseVersion-pre.${{ github.run_number }} (VSIX $vsixVersion)"

      - name: Restore dependencies
        run: dotnet restore Tabkeeper.slnx

      - name: Build VSIX
        run: dotnet build Tabkeeper.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.vsix }}

      - name: Run tests
        run: dotnet test Tabkeeper.slnx --configuration Release --no-build --no-restore

      - name: Compute checksum
        id: hash
        shell: pwsh
        run: |
          $vsix = Get-ChildItem Tabkeeper.Vsix/bin/Release -Recurse -Filter *.vsix | Select-Object -First 1
          $sha  = (Get-FileHash $vsix.FullName -Algorithm SHA256).Hash.ToLower()
          "$sha  $($vsix.Name)" | Set-Content "$($vsix.FullName).sha256" -NoNewline
          "sha256=$sha" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          append_body: true
          body: |
            ---
            `Tabkeeper.vsix` SHA-256: `${{ steps.hash.outputs.sha256 }}`
          fail_on_unmatched_files: true
          files: |
            Tabkeeper.Vsix/bin/Release/**/*.vsix
            Tabkeeper.Vsix/bin/Release/**/*.vsix.sha256
