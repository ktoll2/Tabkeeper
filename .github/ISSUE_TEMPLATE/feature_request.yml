name: Feature request
description: Suggest an improvement to Tabkeeper.
title: "feature: "
labels:
  - enhancement
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Visual Studio
        - VS Code / VSCodium
        - Both / platform-agnostic
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the workflow limitation or pain point.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and any relevant configuration.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
